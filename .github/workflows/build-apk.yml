
name: Compilador HYUNDAI OS

on:
  workflow_dispatch:
  push:
    paths:
      - 'HYUNDAI_OS_ANDROID_PROYECTO_CORREGIDO.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          unzip -o HYUNDAI_OS_ANDROID_PROYECTO_CORREGIDO.zip -d proyecto

      - name: Compilar APK
        run: |
          gradle -p proyecto/HYUNDAI_OS_ANDROID assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HYUNDAI-OS-APK
          path: proyecto/HYUNDAI_OS_ANDROID/app/build/outputs/apk/debug/app-debug.apk

name: Compilar HYUNDAI OS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -q HYUNDAI_OS_ANDROID_PROYECTO.zip -d proyecto

      - name: Compilar APK
        run: gradle -p proyecto/HYUNDAI_OS_ANDROID assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HYUNDAI-OS-APK
          path: proyecto/HYUNDAI_OS_ANDROID/app/build/outputs/apk/debug/app-debug.apk
